name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reminder-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reminder-server/package-lock.json
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('reminder-server/package-lock.json') }}
      - run: npm ci
      - run: npm test

  client:
    name: Client tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reminder-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reminder-app/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
